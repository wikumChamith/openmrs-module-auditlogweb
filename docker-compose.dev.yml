# Dev override: builds the images locally (under local tags so they never
# shadow the published nightly-auditlog images) and mounts the locally built
# omod over the bundled one for fast iteration.
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d
# After a module rebuild (mvn clean package), restart the backend so the file
# mount picks up the new build (up -d alone won't restart an unchanged container):
#   docker compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d --force-recreate backend
# Pass --build after changing the Dockerfiles or spa-assemble-config.json.

services:
  frontend:
    image: auditlogweb-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend

  backend:
    image: auditlogweb-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      # Update the filename when the pom version changes.
      - type: bind
        source: ./omod/target/auditlogweb-1.1.0-SNAPSHOT.omod
        target: /openmrs/distribution/openmrs_modules/auditlogweb-1.1.0-SNAPSHOT.omod
        read_only: true
        bind:
          create_host_path: false
